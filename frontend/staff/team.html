<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>สถานะทีมวันนี้ — ระบบสตาฟ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../config.js"></script>
  <script src="../assets/api.js"></script>
</head>
<body>
  <main class="wide">
    <div class="scan-top">
      <h1>👥 สถานะทีมวันนี้</h1>
      <a href="portal.html" class="muted">กลับ</a>
    </div>
    <p class="muted" id="meta">กำลังโหลด…</p>

    <div class="counts" id="counts" hidden>
      <div class="count in"><b id="n-in">0</b><span>🟢 อยู่ในงาน</span></div>
      <div class="count left"><b id="n-left">0</b><span>🔵 กลับแล้ว</span></div>
      <div class="count not"><b id="n-not">0</b><span>⚪ ยังไม่มา</span></div>
    </div>

    <section id="inbox" hidden>
      <h2>🔔 ต้องจัดการ</h2>
      <div id="alerts"></div>
      <div id="reports"></div>
    </section>

    <section id="propose-box" hidden>
      <h2>✏️ ขอแก้ไขชั่วโมง</h2>
      <form class="card" id="propose">
        <p class="muted small">ส่งให้แอดมินอนุมัติ (ชั่วโมงจะเปลี่ยนเมื่ออนุมัติแล้ว) · ขอแก้ของตัวเองไม่ได้</p>
        <label for="c-member">สมาชิก</label>
        <select id="c-member" required></select>
        <label for="c-date">วันทำงาน</label>
        <input id="c-date" type="date" required>
        <div class="two">
          <div><label for="c-in">เวลาเข้าที่ถูกต้อง</label><input id="c-in" type="time" required></div>
          <div><label for="c-out">เวลาออกที่ถูกต้อง</label><input id="c-out" type="time" required></div>
        </div>
        <label for="c-reason">เหตุผล</label>
        <input id="c-reason" maxlength="300" placeholder="เช่น ลืมสแกนออก เห็นอยู่ถึง 21:00" required>
        <input id="c-report" type="hidden">
        <button class="btn" type="submit" id="c-send">ส่งขอแก้ไข</button>
        <p class="msg" id="c-msg"></p>
      </form>
    </section>

    <h2 id="members-h">สมาชิก</h2>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
    <a class="btn" id="to-scan" href="scan.html" style="margin-top:16px">📷 ไปหน้าสแกน</a>
  </main>

  <script>
    (function () {
      if (!HH.requireLogin()) return;
      var $ = function (id) { return document.getElementById(id); };
      var teamFilter = '';
      var last = null;
      var STATE = {
        IN: { icon: '🟢', text: 'อยู่ในงาน', cls: 'in' },
        LEFT: { icon: '🔵', text: 'กลับแล้ว', cls: 'left' },
        NOT_HERE: { icon: '⚪', text: 'ยังไม่มา', cls: 'not' },
      };

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      function hoursText(h) { return (Math.round(h * 100) / 100) + ' ชม.'; }

      function render(d) {
        last = d;
        fillMembers(d);
        $('meta').textContent = 'วันทำงาน ' + d.workDate + ' · อัปเดตล่าสุด ' + d.serverTime + ' น. · รีเฟรชเองทุก 10 วินาที';
        $('counts').hidden = false;
        var rows = d.members.filter(function (m) { return !teamFilter || m.teamId === teamFilter; });
        $('n-in').textContent = rows.filter(function (m) { return m.state === 'IN'; }).length;
        $('n-left').textContent = rows.filter(function (m) { return m.state === 'LEFT'; }).length;
        $('n-not').textContent = rows.filter(function (m) { return m.state === 'NOT_HERE'; }).length;

        var f = $('filters');
        if (!f.dataset.built && d.teams.length > 1) {
          f.dataset.built = '1';
          [{ teamId: '', name: 'ทุกทีม' }].concat(d.teams).forEach(function (t) {
            var b = el('button', 'chip' + (t.teamId === teamFilter ? ' on' : ''), t.name);
            b.addEventListener('click', function () {
              teamFilter = t.teamId;
              Array.prototype.forEach.call(f.children, function (c) { c.classList.remove('on'); });
              b.classList.add('on');
              render(last);
            });
            f.appendChild(b);
          });
        }

        var list = $('list');
        list.innerHTML = '';
        rows.forEach(function (m) {
          var s = STATE[m.state];
          var row = el('div', 'member-row ' + s.cls + (m.overdue ? ' overdue' : ''));
          var head = el('div', 'mr-head');
          head.appendChild(el('span', 'mr-nick', s.icon + ' ' + m.nickname + (m.overdue ? ' ⏰ อยู่นานเกินกำหนด' : '')));
          head.appendChild(el('span', 'mr-hours', m.sessions.length ? hoursText(m.hoursToday) : ''));
          row.appendChild(head);
          row.appendChild(el('div', 'muted small', m.fullName + ' · ' + m.studentId + ' · ' + m.teamName));
          m.sessions.forEach(function (x) {
            var line = 'เข้า ' + x.in + (x.scannedInBy ? ' (โดย ' + x.scannedInBy + ')' : '');
            line += x.status === 'NEEDS_REVIEW'
              ? ' → ⚠️ ลืมสแกนออก (นับ 0 ชม. รอแก้ไข)'
              : x.out
              ? ' → ออก ' + x.out + (x.scannedOutBy ? ' (โดย ' + x.scannedOutBy + ')' : '') + ' · อยู่ ' + x.rawMinutes + ' นาที นับ ' + hoursText(x.countedHours)
              : ' → ยังอยู่ในงาน';
            row.appendChild(el('div', 'mr-session', line));
          });
          list.appendChild(row);
        });
        if (rows.length === 0) list.appendChild(el('p', 'muted', 'ไม่มีสมาชิกในทีมที่ดูได้'));
      }

      function load() {
        HH.call('team.status').then(function (res) {
          if (!res.ok) {
            if (res.error.code === 'UNAUTHENTICATED') { HH.requireLogin(); return; }
            if (res.error.code === 'FORBIDDEN') {
              HH.say($('meta'), 'หน้านี้สำหรับหัวหน้า รองหัวหน้า และแอดมินเท่านั้น', 'bad');
              $('counts').hidden = true;
              $('to-scan').hidden = true;
              $('members-h').hidden = true;
              return;
            }
            HH.say($('meta'), HH.errorText(res), 'bad');
            return;
          }
          render(res.data);
        });
      }

      // ---- inbox: auto-close alerts and member reports ----
      function loadInbox() {
        HH.call('team.reports').then(function (res) {
          if (!res.ok) return; // deputies cannot read reports (head+), just hide the box
          var d = res.data;
          $('inbox').hidden = d.alerts.length === 0 && d.reports.length === 0;
          var a = $('alerts');
          a.innerHTML = '';
          d.alerts.forEach(function (x) {
            var c = el('div', 'card alert-row');
            c.appendChild(el('b', '', '⚠️ ' + x.nickname + ' (' + x.studentId + ')'));
            c.appendChild(el('div', '', x.detail));
            a.appendChild(c);
          });
          var r = $('reports');
          r.innerHTML = '';
          d.reports.forEach(function (x) {
            var c = el('div', 'card');
            c.appendChild(el('b', '', '📝 ' + x.nickname + ' · ' + x.workDate));
            c.appendChild(el('div', '', x.message));
            var f = el('form', 'resolve');
            var input = el('input');
            input.placeholder = 'บันทึกการตรวจสอบ';
            input.maxLength = 300;
            var btn = el('button', 'btn secondary', 'ตรวจแล้ว');
            btn.type = 'submit';
            var out = el('p', 'msg');
            f.appendChild(input);
            f.appendChild(btn);
            // Turn the report into a correction proposal (prefills the form below).
            var fix = el('button', 'btn secondary', 'ส่งขอแก้ไขชั่วโมง');
            fix.type = 'button';
            fix.addEventListener('click', function () {
              $('c-member').value = x.studentId;
              $('c-date').value = x.workDate;
              $('c-report').value = x.reportId;
              $('c-reason').value = x.message.slice(0, 300);
              $('propose-box').scrollIntoView({ behavior: 'smooth' });
              $('c-in').focus();
            });
            f.appendChild(fix);
            f.addEventListener('submit', function (e) {
              e.preventDefault();
              HH.busy(btn, true, '…');
              HH.call('team.report.resolve', { reportId: x.reportId, note: input.value }).then(function (res2) {
                HH.busy(btn, false);
                if (!res2.ok) { HH.say(out, HH.errorText(res2), 'bad'); return; }
                loadInbox();
              });
            });
            c.appendChild(f);
            c.appendChild(out);
            r.appendChild(c);
          });
        });
      }

      // ---- correction proposals (heads and admins) ----
      function fillMembers(d) {
        var sel = $('c-member');
        if (sel.options.length > 0) return;
        d.members.slice().sort(function (a, b) { return a.nickname.localeCompare(b.nickname, 'th'); }).forEach(function (m) {
          var o = el('option', '', m.nickname + ' · ' + m.studentId + ' · ' + m.teamName);
          o.value = m.studentId;
          sel.appendChild(o);
        });
        if (!$('c-date').value) $('c-date').value = d.workDate;
      }

      HH.call('auth.me').then(function (res) {
        if (res.ok && ['head', 'unit_admin', 'super_admin'].indexOf(res.data.profile.role) !== -1) $('propose-box').hidden = false;
      });

      $('propose').addEventListener('submit', function (e) {
        e.preventDefault();
        HH.busy($('c-send'), true, 'กำลังส่ง…');
        HH.call('correction.propose', {
          studentId: $('c-member').value, workDate: $('c-date').value, in: $('c-in').value, out: $('c-out').value,
          reason: $('c-reason').value, reportId: $('c-report').value,
        }).then(function (res) {
          HH.busy($('c-send'), false);
          if (!res.ok) { HH.say($('c-msg'), HH.errorText(res), 'bad'); return; }
          HH.say($('c-msg'), 'ส่งให้แอดมินแล้ว (' + res.data.appliesTo + ')', 'ok');
          $('c-reason').value = '';
          $('c-report').value = '';
          loadInbox();
        });
      });

      load();
      loadInbox();
      setInterval(function () { if (!document.hidden) load(); }, 10000);
      setInterval(function () { if (!document.hidden) loadInbox(); }, 30000);
    })();
  </script>
</body>
</html>
