<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-TwrZ2UD2QqPmybKgbkhVsf2LLZp0ix214vi0wf2tn3c='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เข้าสู่ระบบ — ระบบสตาฟ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../config.js"></script>
  <script src="../assets/api.js"></script>
  <script src="../assets/vendor/qrcode.js"></script>
  <script src="../assets/twofactor.js"></script>
</head>
<body>
  <main>
    <h1>🎃 เข้าสู่ระบบ</h1>
    <form id="form" autocomplete="on">
      <label for="sid">รหัสนักศึกษา</label>
      <input id="sid" name="username" inputmode="numeric" autocomplete="username" required>
      <label for="pw">รหัสผ่าน</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" id="submit" type="submit">เข้าสู่ระบบ</button>
      <p class="msg" id="msg"></p>
    </form>
    <a class="btn secondary" href="register.html" style="margin-top:16px">🆕 ยังไม่มีบัญชี? สมัครสมาชิก</a>
    <div class="links">
      <p><a href="activate.html">ได้รหัส 6 ตัวจากหัวหน้า? เปิดใช้งานบัญชีที่นี่</a></p>
      <p class="muted">ลืมรหัสผ่าน: ขอรหัสเปิดใช้งานใหม่จากหัวหน้าทีม แล้วไปที่หน้าเปิดใช้งาน</p>
    </div>
  </main>
  <script>
    (function () {
      if (HH.token.get()) { window.location.replace('portal.html'); return; }
      var form = document.getElementById('form');
      var btn = document.getElementById('submit');
      var msg = document.getElementById('msg');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        HH.busy(btn, true, 'กำลังเข้าสู่ระบบ…');
        HH.say(msg, '');
        HH.call('auth.login', {
          studentId: document.getElementById('sid').value,
          password: document.getElementById('pw').value,
          userAgent: navigator.userAgent,
        }).then(function (res) {
          HH.busy(btn, false);
          if (!res.ok) { HH.say(msg, HH.errorText(res), 'bad'); return; }
          HH2FA.finish(res.data, document.getElementById('sid').value);
        });
      });
    })();
  </script>
</body>
</html>
